name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      embed_client:
        description: "Download and embed the original Free Realms client payload (overrides ios/ci-config/embed-client.txt)"
        required: false
        type: boolean
      publish:
        description: "Publish the unsigned IPA to the ios-ipa release (only if you have redistribution rights)"
        required: false
        default: false
        type: boolean
      sanctuary_repo:
        description: "Sanctuary repository to take server data from"
        required: false
        default: "https://github.com/YaimSputnik5/Sanctuary.git"
        type: string
      sanctuary_ref:
        description: "Sanctuary commit or ref"
        required: false
        default: "f5240b7554f2a80d6b815cb7ead7ffee12499565"
        type: string
  # Pushes to ios-build run the same build with repository-controlled settings.
  # This makes CI testable without repository-dispatch credentials.
  push:
    branches:
      - ios-build

permissions:
  contents: write

concurrency:
  group: ios-ipa-build
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build configuration
        id: cfg
        run: |
          set -euo pipefail
          embed="${{ inputs.embed_client }}"
          if [ -z "$embed" ]; then embed="$(tr -d '[:space:]' < ios/ci-config/embed-client.txt)"; fi
          repo="${{ inputs.sanctuary_repo }}"
          if [ -z "$repo" ]; then repo="https://github.com/YaimSputnik5/Sanctuary.git"; fi
          ref="${{ inputs.sanctuary_ref }}"
          if [ -z "$ref" ]; then ref="f5240b7554f2a80d6b815cb7ead7ffee12499565"; fi
          publish="${{ inputs.publish }}"
          if [ -z "$publish" ]; then publish="$(tr -d '[:space:]' < ios/ci-config/publish-release.txt)"; fi
          case "$publish" in
            1|true|TRUE|yes|YES) publish=true ;;
            *) publish=false ;;
          esac
          echo "embed=$embed" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Embedding client payload: $embed; publishing: $publish"

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      # The binary app icon cannot be represented in the MCP file-push path,
      # so restore the upstream original on the runner before building.
      - name: Restore app icon
        run: |
          set -euo pipefail
          mkdir -p ios/Launcher/Resources/Assets.xcassets/AppIcon.appiconset
          curl -fsSL https://raw.githubusercontent.com/Open-Source-Free-Realms/Launcher/main/assets/icon.png \
            -o ios/Launcher/Resources/Assets.xcassets/AppIcon.appiconset/icon.png
          file ios/Launcher/Resources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Clone Sanctuary resources
        env:
          SANCTUARY_REPO: ${{ steps.cfg.outputs.repo }}
          SANCTUARY_REF: ${{ steps.cfg.outputs.ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 "$SANCTUARY_REPO" "$RUNNER_TEMP/Sanctuary"
          git -C "$RUNNER_TEMP/Sanctuary" fetch --depth 1 origin "$SANCTUARY_REF"
          git -C "$RUNNER_TEMP/Sanctuary" checkout --detach FETCH_HEAD

      - name: Sync Sanctuary resources into the app
        env:
          SANCTUARY_DIR: ${{ runner.temp }}/Sanctuary
        run: bash ios/scripts/sync_sanctuary_resources.sh

      - name: Build IPA
        id: build
        continue-on-error: true
        env:
          IOS_EMBED_CLIENT: ${{ steps.cfg.outputs.embed }}
        run: |
          cd ios
          set -o pipefail
          bash ./build_ipa.sh 2>&1 | tee build.log

      # A payload-embedded IPA is larger than the free plan's 500 MB artifact
      # limit; published builds are delivered through the release instead.
      - name: Upload IPA and build log
        if: steps.build.outcome == 'success' && steps.cfg.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OSFRLauncher-ios-unsigned
          path: |
            ios/Launcher.ipa
            ios/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed build log
        if: steps.build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OSFRLauncher-ios-build-log
          path: ios/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          touch ios/build.log
          gh release delete ios-build-log --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create ios-build-log ios/build.log \
            --repo "$GITHUB_REPOSITORY" \
            --title "iOS build log (latest)" \
            --notes "Build log from the latest ios-build workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish ios-ipa release
        if: ${{ steps.cfg.outputs.publish == 'true' && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ios-ipa --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create ios-ipa ios/Launcher.ipa ios/build.log \
            --repo "$GITHUB_REPOSITORY" \
            --title "iOS IPA (unsigned)" \
            --notes "Unsigned iOS 17+ IPA built on GitHub Actions. Install with AltStore or SideStore. Client payload embedded: ${{ steps.cfg.outputs.embed }} (third-party game content; publish only if you have redistribution rights). Sanctuary data: ${{ steps.cfg.outputs.repo }}@${{ steps.cfg.outputs.ref }}."

      - name: Fail if xcodebuild failed
        if: steps.build.outcome != 'success'
        run: exit 1
